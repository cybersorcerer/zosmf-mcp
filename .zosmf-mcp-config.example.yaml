# zosmf-mcp configuration example
# Copy this file to .zosmf-mcp-config.yaml and adapt it to your environment.
# Passwords should never be stored in plain text — use environment variables: ${VAR_NAME}

# ---------------------------------------------------------------------------
# z/OSMF Systems
# One entry per z/OSMF endpoint. A single endpoint can serve an entire sysplex.
# ---------------------------------------------------------------------------
systems:
  - name: "MYZOSMF"
    host: "https://192.168.1.100:443"
    auth:
      type: "basic"
      username: "IBMUSER"
      password: "${ZOSMF_MAINT_PASSWORD}"
    skip_tls_verify: true             # set to false and configure ca_file for production
    # ca_file: "/path/to/ca.pem"      # PEM file with the z/OSMF CA certificate

    # SMP/E defaults (used when not specified in the tool call)
    csi:
      - "SMPE.GLOBAL.CSI"
    zones:
      - "TGT1ZONE"
      - "TGT2ZONE"
      - "TGT3ZONE"
      - "DLB1ZONE"
      - "DLB2ZONE"
      - "DLB3ZONE"
    defaultZones:
      - "GLOBAL"
      - "TGT?ZONE"
      - "DLB?ZONE"

    # TSO settings (required for zosmf_tso_command)
    tso_account:  "ACCT#"
    tso_proc:     "IZUFPROC"
    tso_charset:  "697"
    tso_codepage: "1047"

  # Second system — certificate authentication
  # - name: "PROD"
  #   host: "https://prod.example.com:443"
  #   auth:
  #     type: "certificate"
  #     cert_file: "/path/to/client.pem"
  #     key_file:  "/path/to/client.key"
  #   ca_file: "/path/to/ca.pem"
  #   # Per-system override of the global proxy block below — if url is
  #   # omitted, it inherits the global proxy.url.
  #   proxy:
  #     enabled: false

# ---------------------------------------------------------------------------
# Request forwarding (optional)
# Route all z/OSMF REST calls through a proxy (e.g. a SOCKS5 tunnel to a jump
# host), and/or route ZOAU SSH connections through a jump host (ssh -J).
# Neither block, or enabled: false, means requests go out directly — the
# default, unchanged behavior.
# ---------------------------------------------------------------------------
# proxy:
#   enabled: true
#   url: ${ZOSMF_PROXY}            # e.g. socks5://tunnel:1080; scheme must be http, https or socks5
#
# ssh_proxy_jump:
#   enabled: true
#   host: jump@jumphost.example.com       # passed to ssh -J

# ---------------------------------------------------------------------------
# SSH Systems (optional — required for ZOAU tools)
# One entry per LPAR. SSH and z/OSMF are independent: a single z/OSMF endpoint
# can see all LPARs in a sysplex, but SSH requires a separate entry per LPAR.
# Only SSH key authentication is supported (no passwords).
# ZOAU tools are only registered when at least one ssh_systems entry is present.
# ---------------------------------------------------------------------------
# ssh_systems:
#   - name: "SYSA"
#     host: "my.ssh.server"
#     port: 22                    # optional, default: 22
#     username: "ibmuser"
#    key_file: "~/.ssh/id_rsa"  # optional — omit to use SSH default key (~/.ssh)
#  - name: "MVSB"
#    host: "mvsb.example.com"
#    username: "ibmuser"

# ---------------------------------------------------------------------------
# Transport
# stdio:                  used by Claude Desktop, Claude Code, VS Code, Cursor, etc.
# http.enabled:           used by n8n (HTTP Request nodes), curl, and custom HTTP clients.
# streamable_http.enabled: used by n8n MCP Client Tool Node (v1.88+), supports SSE and Streamable HTTP.
# All transports can run simultaneously.
#
# api_key:        required for a started HTTP/Streamable HTTP transport unless
#                  allow_insecure is set; clients send it as "Authorization: Bearer <key>".
# allow_insecure: opt into starting that transport without an api_key.
# ---------------------------------------------------------------------------
transport:
  stdio: true
  http:
    enabled: false
    listen: ":8080"
    # api_key: ${MCP_API_KEY}
    # allow_insecure: false
  streamable_http:
    enabled: false
    listen: ":8081"
    # api_key: ${MCP_API_KEY}
    # allow_insecure: false
